[package]
name = "custom"
version = "0.1.0"
edition = "2024"

[dependencies]
twilight-gateway = { version = "0.17.1", optional = true }
twilight-model = "0.17.1"
twilight-http = "0.17.1"
twilight-util = { version = "0.17.0", features = ["full"] }
twilight-validate = "0.17.0"

serde_urlencoded = { version = "0.7.1", optional = true }
serde_json = "1.0.151"
serde_repr = "0.1.21"
serde = "1.0.229"

futures-util = "0.3.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"

tracing = {  version = "0.1.44", features = ["std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter","registry", "std", "fmt"] }
opentelemetry_sdk = "0.33.0"
opentelemetry-appender-tracing = "0.33.0"
tracing-opentelemetry = "0.34.0"
opentelemetry = { version = "0.33.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.33.0", features = ["http-proto", "grpc-tonic"] }

mongodb = "3.9.1"
redis = { version = "1.7.1", features = ["aio", "tokio-comp"] }

tokio-websockets = "0.13.3"

humantime = "2.4"
chrono = "0.4"

ed25519-dalek = { version = "3.0", optional = true }
dotenv = "0.15.0"
reqwest = { version = "0.13.5" }
regex = { version = "1.13.1", optional = true }
dashmap = "6.2.1"
hex = { version = "0.4.3", optional = true }

warp = { version = "0.4.3", features = ["websocket", "server"], optional = true }
rusty_paseto = { version = "0.10.1", features = ["core", "v4_local"], optional = true }
anyhow = { version = "1.0.104", optional = true }
json-patch = { version = "4.2.0", optional = true }

[features]
all = ["custom-clients", "tasks", "http-interactions", "api", "gateway"]
custom-clients = []
tasks = []
http-interactions = ["dep:warp", "dep:hex", "dep:anyhow", "dep:ed25519-dalek"]
gateway = ["dep:regex", "dep:twilight-gateway"]
api = ["dep:warp", "dep:rusty_paseto", "dep:serde_urlencoded", "dep:anyhow", "dep:json-patch", "reqwest/json"]
